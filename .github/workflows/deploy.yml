# Builds the website and publishes it on GitHub Pages every time new
# commits are pushed to the main branch. This keeps the public website
# equal to the latest commit in the repository.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the source code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the business-rule tests
        run: node --test

      # GitHub Pages serves the site from /<repository name>/, so we tell
      # Vite to use that folder as the base path (see vite.config.js).
      - name: Build the website
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # GitHub Pages only knows real files. A direct visit to a route such
      # as /experiences/trail-5-sunrise has no file, so Pages would show its
      # own "404" page. We give Pages a 404.html that is a copy of our
      # index.html. The React app then starts and React Router shows the
      # correct page for the address.
      - name: Make nested routes work after a refresh
        run: cp dist/index.html dist/404.html

      - name: Upload the built website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
